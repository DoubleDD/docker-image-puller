<div class="flex flex-col" style="{height: 100%;}">
  <!-- Header -->
  <div class="sticky top-0 z-10 flex justify-between items-center p-2 bg-gray-800 text-white">
    <div class="text-lg font-bold">
      <div class="flex items-center gap-3">
        <i class="fas fa-cube text-3xl text-blue-500"></i>
        <h3 class="text-1xl font-bold text-white mr-2 cursor-pointer" (click)="openBlank()">{{ podName }}</h3>
      </div>
    </div>
    <div class="flex items-center space-x-4">
      <label class="flex items-center space-x-2 cursor-pointer">
        <input type="checkbox" class="form-checkbox h-5 w-5 text-blue-600 border-gray-300 rounded" [(ngModel)]="autoScroll" (change)="scrollToBottom()"/>
        <i class="fas fa-arrow-down" ></i>
      </label>
      <!--时间过滤器-->
      <!--<div class="flex space-x-2">-->
      <!--  <input type="datetime-local" class="p-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent bg-gray-800" />-->
      <!--  <span class="self-center">至</span>-->
      <!--  <input type="datetime-local" class="p-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent bg-gray-800" />-->
      <!--</div>-->
      <button class="p-2 bg-blue-500 text-white rounded hover:bg-blue-600" (click)="refreshLog()">
        <i class="fas fa-sync-alt"></i>
        <!--刷新-->
      </button>
    </div>
  </div>

  <!-- Body -->
  <div class="flex-1 p-4 bg-gray-900 text-white overflow-y-auto" #logBody>
    <!-- 日志内容 -->
    <div class="space-y-2">
      @for (log of logs; track $index) {
        <pre class="hover:bg-gray-700"> {{ log }} </pre>
      }
    </div>
  </div>
</div>
