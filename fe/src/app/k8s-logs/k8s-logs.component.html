<div class="flex flex-col" style="height: 100%">
  <!-- Header -->
  <div
    class="sticky top-0 z-10 flex justify-between items-center p-2 bg-gray-800 text-white"
  >
    <div class="flex text-lg font-bold">
      <div class="flex items-center gap-3">
        <i class="fas fa-cube text-3xl text-blue-500"></i>
        <h3
          class="text-1xl font-bold text-white mr-2 cursor-pointer"
          (click)="openBlank()"
        >
          {{ podName }}
        </h3>
      </div>
      @if (containers.length > 1) {
        <div class="flex items-center gap-3">
          <app-dropdown-selector
            [options]="containers"
            (optionChange)="handleDropdownChange($event)"
          ></app-dropdown-selector>
        </div>
      }
    </div>
    <div class="flex items-center space-x-4">
      <label class="flex items-center space-x-2 cursor-pointer">
        <input
          type="checkbox"
          class="form-checkbox h-5 w-5 text-blue-600 border-gray-300 rounded"
          [(ngModel)]="autoScroll"
          (change)="scrollToBottom()"
        />
        <i class="fas fa-arrow-down" title="自动滚动到底部"></i>
      </label>
      <!--时间过滤器-->
      <!--<div class="flex space-x-2">-->
      <!--  <input type="datetime-local" class="p-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent bg-gray-800" />-->
      <!--  <span class="self-center">至</span>-->
      <!--  <input type="datetime-local" class="p-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent bg-gray-800" />-->
      <!--</div>-->
      <button class="p-2 text-gray-400 rounded" (click)="refreshLog()">
        <i class="fas fa-trash-alt" title="清空日志"></i>
        <!--刷新-->
      </button>
      <button class="p-2 rounded" (click)="play()">
        @if (playing) {
          <i class="fas fa-stop text-red-500" title="停止抓取日志"></i>
        } @else {
          <i class="fas fa-play text-green-500" title="抓取日志"></i>
        }
      </button>
    </div>
  </div>

  <!-- Body -->
  <div class="flex-1 bg-gray-900 text-white">
    <!-- 日志内容 -->
    <cdk-virtual-scroll-viewport
      itemSize="25"
      class="space-y-2 h-full overflow-auto w-full"
    >
      <pre
        *cdkVirtualFor="let item of logs; trackBy: trackByFn"
        class="hover:bg-gray-700"
        >{{ item || " " }}</pre
      >
    </cdk-virtual-scroll-viewport>
  </div>
</div>
