<div class="min-h-screen bg-gray-50 py-8">
  <div class="container mx-auto p-4 max-w-full">
    <div class="bg-white shadow-lg rounded-xl p-8 border border-gray-100">
      <!-- search -->
      <div class="flex items-center gap-3 mb-8">
        <i class="fab fa-docker text-3xl text-blue-500"></i>
        <h2 class="text-2xl font-bold text-gray-800">Docker Image Pull</h2>
      </div>
      <!-- Image URL Input -->
      <div class="flex gap-4 mb-8">
        <input [(ngModel)]="keyword" (keyup.enter)="search()"
          class="flex-1 px-4 py-3 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all"
          placeholder="Enter docker image URL (e.g., nginx:latest)" [disabled]="isProcessing" />
        <button (click)="search()" [disabled]="!keyword || isProcessing"
          class="px-6 py-3 bg-blue-500 text-white rounded-lg hover:bg-blue-600 disabled:bg-gray-400 transition-colors duration-200 shadow-sm">
          <span *ngIf="!isProcessing" class="flex items-center gap-2">
            <i class="fas fa-search"></i>
            Search
          </span>
          <span *ngIf="isProcessing" class="flex items-center gap-2">
            <i class="fas fa-spinner fa-spin"></i>
            Processing...
          </span>
        </button>
      </div>
      <!-- Error Message -->
      <div *ngIf="error"
        class="mb-8 p-4 bg-red-50 border border-red-200 text-red-700 rounded-lg flex items-center gap-2">
        <i class="fas fa-exclamation-circle text-red-500"></i>
        {{ error }}
      </div>


      <div class="grid grid-cols-4 gap-4 mb-8">
        <div *ngFor="let image of images" class="bg-white shadow-lg rounded-xl p-4 border border-gray-100 relative">
          <div class="flex items-center gap-3">
            <i class="fab fa-docker text-3xl text-blue-500"></i>
            <h3 class="text-lg font-semibold text-gray-800">{{ image.name }}</h3>
          </div>
          <p class="text-sm text-gray-600 mt-2">{{ image.description }}</p>
          <div class="mt-4">
            <span class="inline-block bg-blue-100 text-blue-800 text-sm font-medium mr-2 px-2.5 py-0.5 rounded-full">
              {{ image.tag || "latest" }}
            </span>
          </div>
          <!-- 下载图标 -->
          <div class="absolute bottom-4 right-4">
            <button class="text-blue-500 hover:text-blue-700">
              <i class="fas fa-download"></i>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
