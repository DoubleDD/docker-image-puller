<div class="min-h-screen py-8">
  <div class="container mx-auto p-4 max-w-full">
    <div class="rounded-xl p-8">
      <!-- search -->
      <div class="flex items-center gap-3 mb-8">
        <i class="fab fa-docker text-3xl text-blue-500"></i>
        <h2 class="text-2xl font-bold text-white">K8S Images</h2>
      </div>
      <!-- Image URL Input -->
      <div class="flex gap-4 mb-8 relative">
        <!-- 搜索图标 -->
        <div
          class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none"
        >
          <svg
            class="w-5 h-5 text-gray-400"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
            ></path>
          </svg>
        </div>

        <!-- 搜索框 -->
        <input
          [(ngModel)]="keyword"
          (input)="search()"
          type="text"
          class="flex-1 pl-10 px-4 py-3 bg-gray-900 rounded-lg focus:outline-none focus:ring-1 focus:ring-white focus:border-transparent transition-all"
          placeholder="Enter docker image URL (e.g., nginx:latest)"
          [disabled]="isProcessing"
        />
      </div>

      <!-- Error Message -->
      <div
        *ngIf="error"
        class="mb-8 p-4 bg-red-50 border border-red-200 text-red-700 rounded-lg flex items-center gap-2"
      >
        <i class="fas fa-exclamation-circle text-red-500"></i>
        {{ error }}
      </div>

      <div class="flex flex-col space-y-4">
        @for (nsImage of nsImages; track $index) {
          <div class="rounded-xl p-4 border border-gray-900">
            <!-- 命名空间的标签行 -->
            <div class="mb-4">
              <span
                class="inline-block text-gray-100 text-sm font-medium px-2.5 py-1 rounded-full"
                [ngClass]="nsImage.color"
              >
                {{ nsImage.ns }}
              </span>
            </div>
            <div class="grid grid-cols-4 gap-4 mb-8">
              @for (deployment of nsImage.deployments; track $index) {
                <div
                  class="image-item border border-gray-800 transform hover:scale-105 hover:shadow-custom-light transition-all duration-300 bg-gray-400 rounded-xl p-4 relative backdrop-filter backdrop-blur-lg bg-opacity-15 text-white"
                >
                  <div class="flex items-center gap-3">
                    <i class="fab fa-docker text-3xl text-blue-500"></i>
                    <h3 class="text-lg font-semibold">
                      {{ deployment.name | stringLength }}
                    </h3>
                  </div>
                  <p class="text-sm text-gray-400 mt-2">
                    {{ deployment.image.description }}
                  </p>
                  <div class="mt-4 absolute bottom-4 left-4">
                    <span
                      class="inline-block text-sm font-medium mr-2 px-2.5 py-0.5 rounded-full"
                      [ngClass]="nsImage.color"
                    >
                      {{ deployment.image.tag || "latest" }}
                    </span>
                  </div>
                  <!-- 拉镜像 -->
                  <div
                    class="absolute bottom-4 right-12 cursor-pointer"
                    (click)="
                      goToDetail(
                        nsImage.ns,
                        deployment.name,
                        deployment.image.description
                      )
                    "
                  >
                    <button class="text-2xl hover:text-blue-700">
                      <i class="fas fa-download"></i>
                    </button>
                  </div>
                  <!--日志 -->
                  <div
                    class="absolute bottom-4 right-4 cursor-pointer"
                    (click)="goToLog(nsImage.ns, deployment.name)"
                  >
                    <button class="text-blue-500 hover:text-blue-700">
                      <i class="fas fa-file-alt"></i>
                    </button>
                  </div>
                </div>
              }
            </div>
          </div>
        }
      </div>
    </div>
  </div>

  <!-- 下载进度弹窗 -->
  <!--<app-download-progress-modal></app-download-progress-modal>-->
</div>
